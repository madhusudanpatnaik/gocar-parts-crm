<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Employee Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #f8f9fa;
    }
    .sidebar {
      height: 100vh;
      background-color: #343a40;
      color: white;
      padding-top: 20px;
      position: fixed;
      width: 240px;
    }
    .sidebar a {
      color: white;
      display: block;
      padding: 10px 20px;
      text-decoration: none;
    }
    .sidebar a:hover {
      background-color: #495057;
    }
    .content {
      margin-left: 240px;
      padding: 30px;
    }
    .card {
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .filter-row select {
      margin-right: 15px;
    }
  </style>
</head>
<body>

  <!-- Sidebar -->
  <div class="sidebar">
    <h4 class="text-center mb-4">Employee Panel</h4>
    <a href="#">Dashboard</a>
    <a href="#">Revenue</a>
    <a href="#">Expenses</a>
    <a href="#">Sales</a>
    <a href="#">ROI</a>
    <a href="#">Logout</a>
  </div>

  <!-- Main Content -->
  <div class="content">
    <h2 class="mb-4">Employee Dashboard</h2>

    <!-- Filter Options -->
    <div class="row mb-4 filter-row">
      <div class="col-md-3">
        <label class="form-label">Timeframe</label>
        <select class="form-select">
          <option value="7">Last 7 days</option>
          <option value="28">Last 28 days</option>
          <option value="90">Last 90 days</option>
        </select>
      </div>
      <div class="col-md-3">
        <label class="form-label">Agents</label>
        <select class="form-select">
          <option>All</option>
          <option>John</option>
          <option>Pratap</option>
          <option>Sarah</option>
        </select>
      </div>
      <div class="col-md-3">
        <label class="form-label">Part</label>
        <select class="form-select">
          <option>All</option>
          <option>Web</option>
          <option>Call</option>
          <option>Marketing</option>
        </select>
      </div>
    </div>

    <!-- Cards -->
    <div class="row mb-4">
      <div class="col-md-3">
        <div class="card text-white bg-success">
          <div class="card-body">
            <h5 class="card-title">Revenue</h5>
            <p class="card-text">₹1,20,000</p>
          </div>
        </div>
      </div>
      <div class="col-md-3">
        <div class="card text-white bg-danger">
          <div class="card-body">
            <h5 class="card-title">Expenses</h5>
            <p class="card-text">₹40,000</p>
          </div>
        </div>
      </div>
      <div class="col-md-3">
        <div class="card text-white bg-info">
          <div class="card-body">
            <h5 class="card-title">Sales</h5>
            <p class="card-text">230</p>
          </div>
        </div>
      </div>
      <div class="col-md-3">
        <div class="card text-white bg-primary">
          <div class="card-body">
            <h5 class="card-title">ROI</h5>
            <p class="card-text">180%</p>
          </div>
        </div>
      </div>
    </div>

    <!-- Charts -->
    <div class="row">
      <div class="col-md-6 mb-4">
        <div class="card p-3">
          <h6>Lead Source Distribution</h6>
          <canvas id="leadChart"></canvas>
        </div>
      </div>
      <div class="col-md-6 mb-4">
        <div class="card p-3">
          <h6>Sales Over Time</h6>
          <canvas id="salesChart"></canvas>
        </div>
      </div>
    </div>
  </div>

  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script>
    // Lead Source Pie Chart
    new Chart(document.getElementById('leadChart'), {
      type: 'pie',
      data: {
        labels: ['Web', 'Call', 'Marketing'],
        datasets: [{
          data: [120, 90, 30],
          backgroundColor: ['#28a745', '#dc3545', '#ffc107']
        }]
      }
    });

    // Sales Line Chart
    new Chart(document.getElementById('salesChart'), {
      type: 'line',
      data: {
        labels: ['Week 1', 'Week 2', 'Week 3', 'Week 4'],
        datasets: [{
          label: 'Sales',
          data: [50, 80, 65, 100],
          borderColor: '#007bff',
          fill: false
        }]
      }
    });
  </script>

</body>
</html>
